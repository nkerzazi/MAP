events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Backend API (même réseau Docker Compose).
  upstream api { server api:8080; }

  server {
    listen 80;

    # Téléversements volumineux : chunks vidéo jusqu'à 10 Go.
    client_max_body_size 10g;

    # API REST + diffusion HLS (proxifiées vers le backend).
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # SPA Angular (routing côté client → fallback index.html).
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
