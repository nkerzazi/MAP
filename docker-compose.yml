# Pile auto-hébergée complète pour la plateforme vidéo MAP.
# Aucun service externe : tout tourne sur l'infrastructure de la MAP.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mediaplatform
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  api:
    build: { context: ./backend, dockerfile: src/MediaPlatform.Api/Dockerfile }
    depends_on: [postgres, redis, minio]
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mediaplatform;Username=media;Password=media"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__UseSsl: "false"

  # Worker Hangfire (transcodage FFmpeg → HLS). Image incluant ffmpeg.
  worker:
    build: { context: ./backend, dockerfile: src/MediaPlatform.Api/Dockerfile }
    command: ["--worker"]
    depends_on: [postgres, redis, minio]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mediaplatform;Username=media;Password=media"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__UseSsl: "false"

  nginx:
    image: nginx:alpine
    depends_on: [api]
    ports: ["80:80"]
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]

volumes:
  pgdata:
  miniodata:
