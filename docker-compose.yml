# Pile auto-hébergée complète pour la plateforme vidéo MAP.
# Lance d'un coup : base de données, backend (API + worker) et frontend.
# Aucun service externe : tout tourne sur l'infrastructure de la MAP.
#
# Démarrage :  docker compose up -d --build
# Accès app :  http://localhost        (SPA Angular servie par Nginx, /api proxifié)
#
# SEED DES DONNÉES (exécuté automatiquement dans le conteneur api au démarrage) :
#   - les rôles RBAC (Admin / Editeur / Visiteur) sont seedés via les migrations EF Core ;
#   - les comptes admin et super-admin sont créés par AdminSeeder (idempotent) :
#       • admin@map.ma          (cf. Seed__AdminEmail / Seed__AdminPassword ci-dessous)
#       • sa / sa               (super-administrateur — à NE PAS utiliser en production)
#   Les migrations + le seed tournent à chaque démarrage de l'API (idempotents).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mediaplatform
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d mediaplatform"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  # Backend API. Applique les migrations et exécute le seed au démarrage (voir en-tête).
  api:
    build: { context: ./backend, dockerfile: src/MediaPlatform.Api/Dockerfile }
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mediaplatform;Username=media;Password=media"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__UseSsl: "false"
      # --- Seed du compte administrateur (créé au démarrage s'il n'existe pas) ---
      Seed__AdminEmail: "admin@map.ma"
      Seed__AdminPassword: "ChangeMe!Admin2026"

  # Worker Hangfire (transcodage FFmpeg → HLS). Même image que l'API (inclut ffmpeg).
  worker:
    build: { context: ./backend, dockerfile: src/MediaPlatform.Api/Dockerfile }
    command: ["--worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=mediaplatform;Username=media;Password=media"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__UseSsl: "false"

  # Frontend Angular : build de la SPA puis service via Nginx, qui proxifie /api vers l'API.
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    depends_on: [api]
    restart: unless-stopped
    ports: ["80:80"]

volumes:
  pgdata:
  miniodata:
