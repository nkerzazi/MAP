events {}

http {
  # Reverse proxy : front de l'API et diffusion des segments HLS.
  upstream api { server api:8080; }

  server {
    listen 80;

    # API REST
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA Angular (servie statiquement en production)
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
