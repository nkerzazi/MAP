events {}

http {
  # Reverse proxy : front de l'API et diffusion des segments HLS.
  upstream api { server api:8080; }

  server {
    listen 80;

    # Téléversements volumineux : autorise jusqu'à 10 Go par requête.
    # (Les vidéos sont envoyées par chunks ; cette limite couvre largement chaque chunk.)
    client_max_body_size 10g;

    # API REST
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Ne pas mettre en tampon le corps des gros uploads avant de le transmettre.
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # SPA Angular (servie statiquement en production)
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
