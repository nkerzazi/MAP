# Override local : ne publie PAS PostgreSQL sur l'hôte (le port 5432 est occupé par le
# PostgreSQL natif Windows ; l'API s'y connecte de toute façon via le réseau Docker interne).
# L'API reste exposée sur 5080 (en plus du 8080 de base) pour un accès direct éventuel.
services:
  postgres:
    ports: !reset []
  api:
    ports: ["5080:8080"]
